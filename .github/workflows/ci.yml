name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    # Match the dependencies documented in README.md, including Protobuf's CMake config.
    container: archlinux:base-devel
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            packages: gcc
            cc: gcc
            cxx: g++
          - compiler: Clang
            packages: clang
            cc: clang
            cxx: clang++
    defaults:
      run:
        shell: bash
    steps:
      # Git must be available before checkout to fetch the llama.cpp submodule.
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git cmake ninja grpc protobuf ${{ matrix.packages }}

      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=Release
          -DLLAMAD_WARNINGS_AS_ERRORS=ON
          -DGGML_NATIVE=OFF
          -DGGML_VULKAN=OFF
          -DGGML_CUDA=OFF

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

  macos:
    name: macOS Apple Clang
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Install dependencies
        run: brew install grpc protobuf ninja

      - name: Check out source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      # The platform's own compiler and Homebrew's gRPC, as docs/building.md describes. Metal is
      # compiled but not run: the runner has no GPU worth testing on.
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLLAMAD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 3

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
